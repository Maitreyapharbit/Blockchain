version: '3.8'

services:
  # ==================== VALIDATOR NODES (7-node IBFT 2.0) ====================
  
  validator-1:
    image: hyperledger/besu:latest
    container_name: besu-validator-1
    command:
      - --genesis-file=/config/genesis.json
      - --data-path=/data
      - --p2p-port=30303
      - --p2p-host=validator-1
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,IBFT,ADMIN,TXPOOL
      - --rpc-http-allow-host=*
      - --rpc-ws-enabled
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --rpc-ws-api=ETH,NET,WEB3,IBFT
      - --metrics-enabled
      - --metrics-host=0.0.0.0
      - --metrics-port=9545
      - --miner-enabled
      - --miner-coinbase=0x0000000000000000000000000000000000000001
      - --logging=INFO
      - --nat-method=DOCKER
      - --bootnodes=enode://4ab3a290c4c87a2d05d4c4374ac4cce7f8f3ab67b74e91dbf46fde2efb3f90a5@validator-2:30303
    volumes:
      - ./config/genesis.json:/config/genesis.json:ro
      - validator-1-data:/data
    networks:
      pharbit-network:
        ipv4_address: 10.0.1.11
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
      - "9545:9545"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      JAVA_OPTS: "-Xmx2g"

