      - "9103:9101"
    environment:
      JAVA_OPTS: "-Xmx1g"
    depends_on:
      - validator-3

  # ==================== CONSENSUS MONITORING & RPC GATEWAY ====================
  
  consensus-monitor:
    build:
      context: ./backend
      dockerfile: Dockerfile.monitor
    container_name: pharbit-consensus-monitor
    environment:
      VALIDATOR_1_RPC: http://validator-1:8545
      VALIDATOR_2_RPC: http://validator-2:8545
      VALIDATOR_3_RPC: http://validator-3:8545
      VALIDATOR_4_RPC: http://validator-4:8545
      VALIDATOR_5_RPC: http://validator-5:8545
      VALIDATOR_6_RPC: http://validator-6:8545
      VALIDATOR_7_RPC: http://validator-7:8545
      NODE_ENV: production
    networks:
      pharbit-network:
        ipv4_address: 10.0.3.10
    ports:
      - "3001:3001"
    depends_on:
      - validator-1
      - validator-2
      - validator-3
      - validator-4
      - validator-5
      - validator-6
      - validator-7

  # ==================== ARCHIVAL NODE ====================
  
  archival-node:
    image: hyperledger/besu:latest
    container_name: besu-archival
    command:
      - --genesis-file=/config/genesis.json
      - --data-path=/data/archival
      - --p2p-port=30303
      - --p2p-host=archival-node
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,IBFT,ADMIN,TXPOOL,DEBUG
      - --rpc-http-allow-host=*
      - --sync-mode=FULL
      - --pruning-enabled=false
      - --logging=INFO
      - --nat-method=DOCKER
      - --bootnodes=enode://4ab3a290c4c87a2d05d4c4374ac4cce7f8f3ab67b74e91dbf46fde2efb3f90a5@validator-1:30303
    volumes:
      - ./config/genesis.json:/config/genesis.json:ro
      - archival-data:/data/archival
    networks:
      pharbit-network:
        ipv4_address: 10.0.1.20
    ports:
      - "8556:8545"
      - "30310:30303"
    environment:
      JAVA_OPTS: "-Xmx4g"
    depends_on:
      - validator-1

networks:
  pharbit-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/16

volumes:
  validator-1-data:
  validator-2-data:
  validator-3-data:
  validator-4-data:
  validator-5-data:
  validator-6-data:
  validator-7-data:
  tessera-validator-1-data:
  tessera-validator-2-data:
  tessera-validator-3-data:
  archival-data:
