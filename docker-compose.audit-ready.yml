  # ==================== TESSERA PRIVATE ENCLAVES ====================
  
  tessera-validator-1:
    image: quorumengineering/tessera:latest
    container_name: tessera-validator-1
    command:
      - -configfile=/config/tessera-config.json
    volumes:
      - ./config/tessera-config.json:/config/tessera-config.json:ro
      - tessera-validator-1-data:/data
    networks:
      pharbit-network:
        ipv4_address: 10.0.2.11
    ports:
      - "9081:9081"
      - "9101:9101"
    environment:
      JAVA_OPTS: "-Xmx1g"
    depends_on:
      - validator-1

  tessera-validator-2:
    image: quorumengineering/tessera:latest
    container_name: tessera-validator-2
    command:
      - -configfile=/config/tessera-config.json
    volumes:
      - ./config/tessera-config.json:/config/tessera-config.json:ro
      - tessera-validator-2-data:/data
    networks:
      pharbit-network:
        ipv4_address: 10.0.2.12
    ports:
      - "9082:9081"
      - "9102:9101"
    environment:
      JAVA_OPTS: "-Xmx1g"
    depends_on:
      - validator-2

  tessera-validator-3:
    image: quorumengineering/tessera:latest
    container_name: tessera-validator-3
    command:
      - -configfile=/config/tessera-config.json
    volumes:
